[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-anomaly-detection"
version = "0.1.0"
description = "Reproducible temporal transaction anomaly screening benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
transaction-anomaly = "transaction_anomaly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
