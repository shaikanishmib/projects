[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histopathology-classification"
version = "0.1.0"
description = "Patient-separated, reproducible pathology image classification experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "Pillow>=13.0.0,<14", "scikit-learn>=1.3,<2", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
histopath = "histopathology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

